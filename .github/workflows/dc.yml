name: CD

on:
  workflow_run:                  # run only after CI finishes...
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write                # allows pushing to GitHub Container Registry

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}   # ...and only if CI passed
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # provided automatically, no setup needed

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: server/Api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/first-dotnet-api:latest

      - name: Build & push client image
        uses: docker/build-push-action@v6
        with:
          context: client
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/first-dotnet-client:latest